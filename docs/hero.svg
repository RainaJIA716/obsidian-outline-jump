<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <style>
    .card { fill: #FFFFFF; stroke: #E3DDD2; stroke-width: 1.5; }
    .ico { fill: none; stroke: #8B8177; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .ico-new { fill: none; stroke: #7A5AF8; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .h { fill: #2F2A24; font-size: 17px; }
    .h2 { fill: #5C544B; font-size: 16px; }
    .muted { fill: #8B8177; font-size: 15px; }
    .title { fill: #2F2A24; font-size: 34px; font-weight: 700; }
    .sub { fill: #6B6259; font-size: 19px; }
    .note { fill: #5B3FD6; font-size: 17px; font-weight: 600; }
    .line { fill: #EFE9DD; }
    .arrow { fill: none; stroke: #7A5AF8; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 7 7; }
  </style>
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#2B2A28" flood-opacity="0.10"/>
    </filter>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#7A5AF8"/>
    </marker>
    <g id="ic-search"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></g>
    <g id="ic-follow"><path d="M3 2h18"/><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 22h18"/></g>
    <g id="ic-collapse"><path d="m7 20 5-5 5 5"/><path d="m7 4 5 5 5-5"/></g>
    <g id="ic-top"><path d="M5 3h14"/><path d="m18 13-6-6-6 6"/><path d="M12 7v14"/></g>
    <g id="ic-bottom"><path d="M12 17V3"/><path d="m6 11 6 6 6-6"/><path d="M19 21H5"/></g>
  </defs>

  <rect width="1200" height="800" fill="#FAF8F4"/>

  <text x="60" y="78" class="title">Outline Jump</text>
  <text x="60" y="114" class="sub">Two buttons on the core Outline pane: jump to the top or bottom of the note.</text>

  <!-- Outline pane -->
  <g filter="url(#soft)"><rect x="60" y="160" width="420" height="580" rx="14" class="card"/></g>
  <rect x="61" y="161" width="418" height="62" rx="13" fill="#F7F3E8"/>
  <rect x="61" y="200" width="418" height="23" fill="#F7F3E8"/>
  <line x1="60" y1="223" x2="480" y2="223" stroke="#E3DDD2" stroke-width="1.5"/>

  <use href="#ic-search" class="ico" transform="translate(88 180)"/>
  <use href="#ic-follow" class="ico" transform="translate(132 180)"/>
  <use href="#ic-collapse" class="ico" transform="translate(176 180)"/>

  <!-- the two new buttons -->
  <rect x="210" y="170" width="92" height="44" rx="10" fill="#EFEAFE" stroke="#7A5AF8" stroke-width="1.8"/>
  <use href="#ic-top" class="ico-new" transform="translate(222 180)"/>
  <use href="#ic-bottom" class="ico-new" transform="translate(266 180)"/>

  <text x="92" y="268" class="h">Introduction</text>
  <text x="116" y="306" class="h2">Background</text>
  <text x="116" y="344" class="h2">Goals</text>
  <text x="92" y="390" class="h">Method</text>
  <text x="116" y="428" class="h2">Setup</text>
  <text x="116" y="466" class="h2">Steps</text>
  <text x="92" y="512" class="h">Results</text>
  <text x="116" y="550" class="h2">Details</text>
  <text x="92" y="596" class="h">Discussion</text>
  <text x="92" y="642" class="h">Appendix</text>

  <!-- callout for buttons -->
  <path d="M256 156 C 256 134, 330 134, 360 136" class="arrow" marker-end="url(#tip)" stroke-dasharray="0"/>
  <text x="368" y="142" class="note">new, right on the native toolbar</text>

  <!-- Note -->
  <g filter="url(#soft)"><rect x="560" y="160" width="580" height="580" rx="14" class="card"/></g>
  <rect x="600" y="196" width="300" height="22" rx="5" fill="#2F2A24" opacity="0.85"/>
  <text x="920" y="214" class="muted">top of note</text>
  <rect x="600" y="244" width="480" height="12" rx="6" class="line"/>
  <rect x="600" y="270" width="440" height="12" rx="6" class="line"/>
  <rect x="600" y="296" width="460" height="12" rx="6" class="line"/>
  <rect x="600" y="340" width="200" height="16" rx="5" fill="#CFC6B6"/>
  <rect x="600" y="372" width="470" height="12" rx="6" class="line"/>
  <rect x="600" y="398" width="420" height="12" rx="6" class="line"/>
  <rect x="600" y="424" width="450" height="12" rx="6" class="line"/>
  <text x="820" y="478" class="muted" text-anchor="middle">…  long note  …</text>
  <rect x="600" y="520" width="180" height="16" rx="5" fill="#CFC6B6"/>
  <rect x="600" y="552" width="470" height="12" rx="6" class="line"/>
  <rect x="600" y="578" width="430" height="12" rx="6" class="line"/>
  <rect x="600" y="604" width="460" height="12" rx="6" class="line"/>
  <rect x="600" y="630" width="300" height="12" rx="6" class="line"/>
  <text x="920" y="700" class="muted">end of note</text>
  <line x1="600" y1="708" x2="1100" y2="708" stroke="#2F2A24" stroke-opacity="0.35" stroke-width="2"/>

  <!-- jump arrows -->
  <path d="M234 222 C 330 300, 470 206, 592 206" class="arrow" marker-end="url(#tip)"/>
  <path d="M278 222 C 400 520, 470 700, 592 700" class="arrow" marker-end="url(#tip)"/>

  <text x="60" y="776" class="muted">Works in editing and reading view  ·  jumps the note the outline is showing  ·  on phones, closes the drawer so you see where you landed</text>
</svg>
